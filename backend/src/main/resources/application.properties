spring.application.name=duediligence

# ===== Database Connection (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/duediligence_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===== JPA / Hibernate =====
# Auto-creates/updates tables based on your @Entity classes at startup.
spring.jpa.hibernate.ddl-auto=update
# Prints the actual SQL Hibernate runs \u2014 useful for debugging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
# Secret key used to sign and verify JWT tokens. Keep this long, random, and private.
jwt.secret=ThisIsASecretKeyForJWTSigningMakeItLongAndRandom123456789
# Token expiration time in milliseconds. 86400000 ms = 24 hours.
jwt.expiration=86400000

