spring.application.name=duediligence
server.port=8080

# Database Configuration (H2 in-memory DB for zero-config execution)
spring.datasource.url=jdbc:h2:mem:duediligence_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=root

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a2f8c4e6b0d1e3f5a7c9b2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f
app.jwt.expiration-ms=86400000

