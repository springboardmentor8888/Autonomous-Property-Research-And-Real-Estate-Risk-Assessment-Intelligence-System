spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/realestate_db
spring.datasource.username=${REAL_ESTATE_DB_USERNAME}
spring.datasource.password=${REAL_ESTATE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${REAL_ESTATE_MAIL_USERNAME}
spring.mail.password=${REAL_ESTATE_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080