spring.application.name=duediligence

# Secret key used to sign and verify JWT tokens.
# Keep this key long, random, and private.
jwt.secret=ThisIsASecretKeyForJWTSigningMakeItLongAndRandom123456789

# JWT token expiration time in milliseconds.
# 86400000 milliseconds = 24 hours (1 day).
jwt.expiration=86400000