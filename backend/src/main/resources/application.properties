spring.application.name=duediligence

# JWT
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJWTSigningMakeItLongAndRandom123456789}
jwt.expiration=86400000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/duediligence_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Geoapify Geocoding API
# Get your free key at https://www.geoapify.com/
geoapify.api.key=${GEOAPIFY_API_KEY:}