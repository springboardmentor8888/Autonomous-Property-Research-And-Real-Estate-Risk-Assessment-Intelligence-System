nspring.application.name=duediligence

# ===== Database Connection (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/duediligence_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# Auto-creates/updates tables based on your @Entity classes at startup.
spring.jpa.hibernate.ddl-auto=update
# Prints the actual SQL Hibernate runs \u2014 useful for debugging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
# Secret key used to sign and verify JWT tokens. Keep this long, random, and private.
jwt.secret=ThisIsASecretKeyForJWTSigningMakeItLongAndRandom123456789
# Token expiration time in milliseconds. 86400000 ms = 24 hours.
jwt.expiration=86400000

#======= API =======
geoapify.api.key=${GEOAPIFY_API_KEY}2b

# ============================================================
# Gmail SMTP Configuration
# ============================================================

# Gmail's SMTP (Simple Mail Transfer Protocol) server.
# SMTP is used by the application to send emails.
spring.mail.host=smtp.gmail.com

# Port 587 is used for SMTP submission with STARTTLS encryption.
spring.mail.port=587

# Gmail account used by the application to send emails.
# The actual email address is stored in the MAIL_USERNAME
# environment variable instead of being written directly here.
spring.mail.username=${MAIL_USERNAME}

# Gmail App Password used to authenticate with Gmail SMTP.
# IMPORTANT: Do NOT use your normal Gmail password here.
# The actual App Password is stored in the MAIL_APP_PASSWORD
# environment variable so it is not exposed in the source code.
spring.mail.password=${MAIL_APP_PASSWORD}

# Enables SMTP authentication.
# Gmail requires the application to authenticate before
# it can send emails through the SMTP server.
spring.mail.properties.mail.smtp.auth=true

# Enables STARTTLS encryption.
# This upgrades the SMTP connection to a secure encrypted
# connection before authentication and email transmission.
spring.mail.properties.mail.smtp.starttls.enable=true