# Test configuration
google.api.base-url=https://maps.googleapis.com

# Google Geocoding API Key for tests
app.google.geocoding.api-key=test-api-key-for-unit-tests

# Google Address Validation for tests (reuses the geocoding test key)
google.addressvalidation.base-url=https://addressvalidation.googleapis.com
app.google.addressvalidation.api-key=test-api-key-for-unit-tests

# Places API for tests
app.google.places.api-key=test-places-api-key

# Apify for tests (disabled — no real token in CI)
app.apify.api-key=
app.apify.base-url=https://api.apify.com
app.apify.actor-id=thirdwatch~acres99-scraper
app.apify.search-mode=buy
app.apify.max-results=15
app.apify.timeout-seconds=120

# Mappls Search for tests
app.mappls.textsearch.api-key=test-mappls-api-key

# JWT config for tests
app.security.jwt-secret=test-jwt-secret-key-at-least-32-characters-long-for-testing
app.security.jwt-expiration-ms=3600000

# Disable Flyway for tests
spring.flyway.enabled=false

# Use H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable data.sql for tests (schema created by ddl-auto)
spring.sql.init.mode=never

# Disable external services
spring.cache.type=none

# Required by the Chennai GIS client during application-context tests
chennai.gcc-gis.base-url=https://gccservices.chennaicorporation.gov.in/gccservices/rest/services
