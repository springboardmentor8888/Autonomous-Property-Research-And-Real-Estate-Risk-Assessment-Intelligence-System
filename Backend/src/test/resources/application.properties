# Test configuration
google.api.base-url=https://maps.googleapis.com

# Google Geocoding API Key for tests
google.geocoding.api-key=test-api-key-for-unit-tests

# JWT config for tests
app.security.jwt-secret=test-jwt-secret-key-at-least-32-characters-long-for-testing
app.security.jwt-expiration-ms=3600000

# Disable Flyway for tests
spring.flyway.enabled=false

# Use H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable data.sql for tests (schema created by ddl-auto)
spring.sql.init.mode=never

# Disable external services
spring.cache.type=none
