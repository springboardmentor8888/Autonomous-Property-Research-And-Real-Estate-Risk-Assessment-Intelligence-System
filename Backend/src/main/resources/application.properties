spring.application.name=Backend
server.port=9090

# Database — H2 in-memory by default for local development.
# Switch to PostgreSQL by setting SPRING_PROFILES_ACTIVE=postgres.
spring.datasource.url=jdbc:h2:mem:backenddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway (disabled for H2 in-memory — schema is generated via ddl-auto=update)
spring.flyway.enabled=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Google Maps Platform APIs - ONLY Google Geocoding API v4 used
google.api.base-url=https://geocode.googleapis.com
# Internal property names - default to empty string to avoid circular references
app.google.geocoding.api-key=

# Places API (New) — used ONLY as a fallback enricher when Geocoding's
# match types leave property type undetermined. Reuses the Geocoding key
# unless GOOGLE_PLACES_API_KEY is set and Places (New) is enabled on it.
google.places.base-url=https://places.googleapis.com
app.google.places.api-key=

# Mappls Search — fallback classifier when Geocoding's match types
# leave property_type undetermined. Key comes from mappls.textsearch.api-key in .env
mappls.textsearch.base-url=https://search.mappls.com
app.mappls.textsearch.api-key=
mappls.textsearch.region=ind

# Jackson — Spring Boot 4.1 ships Jackson 3.x. WRITE_DATES_AS_TIMESTAMPS
# was removed in 3.x (the default is now false), so we don't set it.
spring.jackson.default-property-inclusion=NON_NULL

# Caching is disabled for local dev (no Redis instance is run alongside
# the app). The former RedisConfig bean was removed — it was inert here and
# caused DevTools classloader conflicts. Re-introduce a cache config together
# with a real Redis when one is available.
spring.cache.type=none
spring.data.redis.repositories.enabled=false

# JWT Security — the signing secret comes from `.env` (app.security.jwt-secret)
# Expirations are non-secret config and stay here.
app.security.jwt-secret=${app.security.jwt-secret:}
app.security.jwt-expiration-ms=3600000
app.security.refresh-expiration-ms=604800000

# Load local secrets straight from the project root .env (properties
# format). Both relative paths are tried so the app starts whether the
# working directory is the project root (IDE run config) or Backend/
# (./mvnw spring-boot:run). If .env is missing, startup fails fast on the
# unresolvable app.security.jwt-secret — by design, no silent dev key.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.duedilligenceagent=DEBUG
