spring.application.name=Backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/real_estate_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial existing schema

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# JWT Security
app.security.jwt-secret=${JWT_SECRET:change-this-development-secret-key-at-least-32-characters-long}
app.security.jwt-expiration-ms=3600000

logging.level.org.springframework.security=INFO