# PostgreSQL Profile — activate with SPRING_PROFILES_ACTIVE=postgres

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/duedilligence_db
spring.datasource.username=sami
spring.datasource.password=sami@*123#
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP defaults are fine for dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Flyway (enabled for PostgreSQL — schema versioning)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Console disabled for prod profile
spring.h2.console.enabled=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Logging
logging.level.com.duedilligenceagent=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
