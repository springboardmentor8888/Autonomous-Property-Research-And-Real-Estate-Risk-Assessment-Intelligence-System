# PostgreSQL Profile — activate with SPRING_PROFILES_ACTIVE=postgres

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/duedilligence_db
spring.datasource.username=${app.db.username:sami}
spring.datasource.password=${app.db.password:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP defaults are fine for dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Static due-diligence dataset: the 50-property seed loads after data.sql
# (which must insert admin@example.com first — the due_diligence_reports
# rows reference that user). Every seed INSERT is idempotent
# (ON CONFLICT DO NOTHING), so re-boots skip already-seeded rows.
spring.sql.init.data-locations=classpath:data.sql,classpath:db/seed/real_estate_due_diligence_seed_50.sql

# Flyway (enabled for PostgreSQL — schema versioning)
# Spring Boot 4.1 deliberately orders JPA schema creation (ddl-auto) BEFORE
# Flyway (JpaDatabaseInitializerDetector wires flywayInitializer to depend on
# the EntityManagerFactory). Hibernate therefore creates/extends the schema
# first; Flyway then baselines over it (baseline-on-migrate) and applies
# FUTURE migrations (V2+) after Hibernate's update. V1__baseline.sql documents
# the schema at the point Flyway was adopted.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Console disabled for prod profile
spring.h2.console.enabled=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Logging
logging.level.com.duedilligenceagent=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
