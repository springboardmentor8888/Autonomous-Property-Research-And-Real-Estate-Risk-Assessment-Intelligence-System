# PostgreSQL Profile — activate with SPRING_PROFILES_ACTIVE=postgres

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/duedilligence_db
spring.datasource.username=${app.db.username:sami}
spring.datasource.password=${app.db.password:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP defaults are fine for dev)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
# Flyway OWNS the schema (V1__baseline.sql on fresh DBs, V2+ migrations after).
# Hibernate's ddl-auto is 'none': no schema creation and no premature
# validation — the JpaDatabaseInitializerDetector would otherwise validate
# the SessionFactory BEFORE Flyway runs its baseline/migrations and fail on a
# fresh database. With 'none', Flyway runs first, then sql.init (data.sql +
# the seed, both idempotent) loads the demo data + admin user, and the app
# starts against the Flyway-created schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# sql.init runs after Flyway's migrations so the schema exists before
# data.sql + the seed file are applied.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Static due-diligence dataset: the 50-property seed loads after data.sql
# (which must insert admin@example.com first — the due_diligence_reports
# rows reference that user). Every seed INSERT is idempotent
# (ON CONFLICT DO NOTHING), so re-boots skip already-seeded rows.
spring.sql.init.data-locations=classpath:data.sql,classpath:db/seed/real_estate_due_diligence_seed_50.sql

# Flyway (schema versioning — the schema manager for PostgreSQL).
# defer-datasource-initialization=true makes Spring Boot 4.1 run Flyway's
# migrate BEFORE the JPA EntityManagerFactory, so on a fresh database the
# V1 baseline creates the schema first and Hibernate's ddl-auto=validate
# validates against it. On existing databases Flyway baselines (V1 is not
# re-applied) and only future V2+ migrations run.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 Console disabled for prod profile
spring.h2.console.enabled=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# Logging
logging.level.com.duedilligenceagent=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
